<html lang="pt-BR">

<head>

  <meta name="author" content="Luis Henrique Campaci">
  <meta name="theme-color" content="#ffffff">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Lista de Compras</title>

  <script defer
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
  </script>

  <script defer
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
  </script>

  <style>

    /* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #ffffff;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
  width: 100%;
  max-width: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  padding: 12px;
  padding-bottom: 70px;

  gap: 6px;

  overflow: hidden;
}


/* =====================================================
   TOPO
===================================================== */

.topo-app {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 2px;
}


/* =====================================================
   PESQUISA
===================================================== */

#pesquisa {
  width: 100%;
  height: 36px;

  margin: 0;

  border-radius: 6px;
  border: 1px solid #ddd;

  padding: 6px 10px;

  font-size: 13px;

  text-transform: uppercase;
}


/* =====================================================
   MENU MOBILE
===================================================== */

.menu-mobile {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  width: 100vw;
  max-width: 100vw;

  margin: 0;

  padding: 5px 1px;

  display: flex;
  justify-content: space-between;
  align-items: stretch;

  background: #ffffff;

  border-top: 1px solid #e5e7eb;

  box-shadow:
    0 -2px 12px rgba(0, 0, 0, .08);

  z-index: 9999;

  overflow: hidden;
}


/* =====================================================
   BOTÕES DO MENU
===================================================== */

.menu-mobile button {
  flex: 1 1 0;

  min-width: 0;
  width: 0;

  height: 50px;
  min-height: 50px;

  border: none;

  background: none;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 2px;

  padding: 2px 0;

  color: #6b7280;

  overflow: hidden;

  cursor: pointer;
}

.menu-mobile button span {
  display: block;

  font-size: 18px;
  line-height: 19px;

  max-width: 100%;
}

.menu-mobile button small {
  display: block;

  font-size: 7px;
  line-height: 9px;

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;

  max-width: 100%;
}


/* =====================================================
   FORMULÁRIO
===================================================== */

.formulario {
  margin-bottom: 6px;

  display: flex;
  flex-direction: column;

  gap: 8px;
}

input,
select {
  height: 36px;

  border-radius: 6px;
  border: 1px solid #ddd;

  padding: 6px 10px;

  font-size: 13px;

  box-sizing: border-box;

  text-transform: uppercase;
}

button {
  border: none;

  cursor: pointer;

  font-weight: bold;

  color: #ffffff;

  transition: .2s;
}

button:hover {
  opacity: .9;
}


/* =====================================================
   TABELA
===================================================== */

.tabela-wrapper {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;
  overflow-x: hidden;
}

table {
  width: 100%;

  border-collapse: collapse;

  table-layout: fixed;
}

thead th {
  position: sticky;

  top: 0;

  z-index: 2;
}

th,
td {
  padding: 8px;

  border-bottom: 1px solid #eeeeee;

  word-break: break-word;
}

th {
  background: #2563eb;

  color: #ffffff;
}

tr:hover {
  background: #f5f7fa;
}

tbody tr {
  cursor: pointer;
}


/* =====================================================
   COLUNAS
===================================================== */

th:nth-child(1),
td:nth-child(1) {
  width: 25px;

  padding: 4px 2px;

  text-align: center;

  white-space: nowrap;
}

th:nth-child(2),
td:nth-child(2) {
  width: 40%;
}

th:nth-child(3),
td:nth-child(3) {
  width: 45px;

  text-align: right;

  white-space: nowrap;
}

th:nth-child(4),
td:nth-child(4) {
  width: 70px;

  text-align: right;

  white-space: nowrap;
}

th:nth-child(5),
td:nth-child(5) {
  width: 70px;

  text-align: right;

  white-space: nowrap;
}

th:nth-child(6),
td:nth-child(6) {
  width: 35px;

  text-align: center;

  white-space: nowrap;
}


/* =====================================================
   ITEM COMPRADO
===================================================== */

.comprado td {
  text-decoration: line-through;

  opacity: .6;

  background: #e8f5e9;
}


/* =====================================================
   CHECKBOX
===================================================== */

.check-container {
  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  width: 24px;
  height: 24px;

  margin: auto;

  cursor: pointer;
}

.check-container input {
  opacity: 0;

  width: 0;
  height: 0;
}

.checkmark {
  position: absolute;

  inset: 0;

  background: #e5e7eb;

  border-radius: 6px;

  transition: .2s;

  border: 2px solid #cbd5e1;
}

.checkmark::after {
  content: "";

  position: absolute;

  display: none;

  left: 7px;
  top: 2px;

  width: 5px;
  height: 10px;

  border: solid #ffffff;

  border-width: 0 3px 3px 0;

  transform: rotate(45deg);
}

.check-container input:checked + .checkmark {
  background: #22c55e;

  border-color: #22c55e;
}

.check-container input:checked + .checkmark::after {
  display: block;
}


/* =====================================================
   RESUMO / TOTAL
===================================================== */

.total {
  flex-shrink: 0;

  display: flex;

  justify-content: space-between;
  align-items: flex-start;

  gap: 20px;

  width: 100%;

  font-size: 18px;

  margin-top: 4px;
  margin-bottom: 0;

  padding: 6px 0;

  min-height: 60px;
}

.resumo-esquerda,
.resumo-direita {
  display: flex;

  flex-direction: column;

  gap: 8px;
}

.resumo-direita {
  text-align: right;
}


/* =====================================================
   BOTÕES
===================================================== */

.btn-salvar,
.btn-salvar-novo,
.btn-salvar-edicao {
  background: #22c55e;
}

.btn-txt {
  background: #6b7280;
}

.btn-pdf {
  background: #dc2626;
}

.btn-print {
  background: #0891b2;
}

.btn-export {
  background: #2563eb;
}

.btn-import {
  background: #16a34a;
}

.btn-editar {
  background: #22c55e;

  padding: 5px 8px;
}

.btn-excluir {
  background: #ef4444;

  padding: 5px 8px;
}


/* =====================================================
   MODAIS
===================================================== */

.modal {
  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, .45);

  display: none;

  align-items: center;
  justify-content: center;

  z-index: 99999;
}

.modal-conteudo,
.modal-edicao-conteudo,
.modal-novo-item {
  background: #ffffff;

  width: 92%;
  max-width: 360px;

  border-radius: 12px;

  padding: 20px;

  animation: fade .2s ease;
}

.modal-conteudo {
  max-width: 320px;

  text-align: center;
}

.modal-conteudo h3,
.modal-edicao-conteudo h3,
.modal-novo-item h3 {
  margin-bottom: 16px;

  color: #333333;

  text-align: center;
}

.modal-conteudo h3 {
  font-size: 18px;

  margin-bottom: 18px;
}


/* =====================================================
   BOTÕES DOS MODAIS
===================================================== */

.modal-botoes {
  display: flex;

  flex-direction: column;

  gap: 10px;
}

.modal-botoes button {
  height: 42px;

  border: none;

  border-radius: 8px;

  color: #ffffff;

  font-weight: bold;

  font-size: 14px;
}

.btn-cancelar {
  background: #6b7280;
}


/* =====================================================
   EDIÇÃO
===================================================== */

.form-edicao,
.form-novo-item {
  display: flex;

  flex-direction: column;

  gap: 10px;
}

.form-edicao input,
.form-edicao select,
.form-novo-item input,
.form-novo-item select {
  width: 100%;

  height: 40px;
}

.botoes-edicao,
.botoes-novo-item {
  display: flex;

  gap: 8px;

  margin-top: 8px;
}

.botoes-edicao button,
.botoes-novo-item button {
  flex: 1;

  height: 40px;

  border-radius: 8px;
}

.btn-cancelar-edicao,
.btn-cancelar-novo {
  background: #6b7280;
}


/* =====================================================
   TEMA BRANCO
===================================================== */

body.tema-branco {
  background: #ffffff;

  color: #111827;
}

body.tema-branco .container {
  background: #ffffff;
}

body.tema-branco .topo-app h1 {
  color: #111827;
}

body.tema-branco table {
  background: #ffffff;

  color: #111827;
}

body.tema-branco th {
  background: #2563eb;

  color: #ffffff;
}

body.tema-branco td {
  border-bottom-color: #eeeeee;
}

body.tema-branco tr:hover {
  background: #f5f7fa;
}

body.tema-branco input,
body.tema-branco select {
  background: #ffffff;

  color: #111827;

  border-color: #d1d5db;
}

body.tema-branco .menu-mobile {
  background: #ffffff;

  border-top-color: #e5e7eb;
}

body.tema-branco .menu-mobile button {
  color: #6b7280;
}


/* =====================================================
   TEMA ESCURO
===================================================== */

body.tema-escuro {
  background: #111827;

  color: #f9fafb;
}

body.tema-escuro .container {
  background: #111827;
}

body.tema-escuro .topo-app h1 {
  color: #f9fafb;
}

body.tema-escuro input,
body.tema-escuro select {
  background: #1f2937;

  color: #f9fafb;

  border-color: #374151;
}

body.tema-escuro table {
  background: #111827;

  color: #f9fafb;
}

body.tema-escuro th {
  background: #2f373d;

  color: #ffffff;
}

body.tema-escuro td {
  border-bottom-color: #374151;
}

body.tema-escuro tr:hover {
  background: #1f2937;
}

body.tema-escuro .menu-mobile {
  background: #1f2937;

  border-top-color: #374151;

  box-shadow:
    0 -2px 12px rgba(0, 0, 0, .4);
}

body.tema-escuro .menu-mobile button {
  color: #d1d5db;
}

body.tema-escuro .total {
  color: #f9fafb;
}

body.tema-escuro .comprado td {
  background: #16351f;
}

body.tema-escuro .modal-conteudo,
body.tema-escuro .modal-edicao-conteudo,
body.tema-escuro .modal-novo-item {
  background: #1f2937;

  color: #f9fafb;
}

body.tema-escuro .modal-conteudo h3,
body.tema-escuro .modal-edicao-conteudo h3,
body.tema-escuro .modal-novo-item h3 {
  color: #f9fafb;
}


/* =====================================================
   WINDOWS 98
===================================================== */

body.tema-windows98 {
  background: #008080;

  color: #000000;

  font-family:
    "MS Sans Serif",
    Tahoma,
    Arial,
    sans-serif;
}

body.tema-windows98 * {
  font-family:
    "MS Sans Serif",
    Tahoma,
    Arial,
    sans-serif;
}

body.tema-windows98 .container {
  background: #c0c0c0;

  border: 3px outset #ffffff;

  padding: 10px;
  padding-bottom: 75px;

  height: 100dvh;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}


body.tema-windows98 .topo-app {
  background: #000080;

  padding: 4px 6px;

  margin-bottom: 6px;
}

body.tema-windows98 input,
body.tema-windows98 select {
  background: #ffffff;

  color: #000000;

  border: 2px inset #ffffff;

  border-radius: 0;
}

/* =====================================================
   WINDOWS 98 — BOTÕES
===================================================== */

body.tema-windows98 button {
  appearance: none;

  background: #c0c0c0;
  color: #000000;

  border: 2px solid;

  border-top-color: #ffffff;
  border-left-color: #ffffff;
  border-right-color: #808080;
  border-bottom-color: #808080;

  border-radius: 0;

  font-family:
    "MS Sans Serif",
    Tahoma,
    Arial,
    sans-serif;

  font-size: 11px;
  font-weight: normal;

  text-shadow: none;

  box-shadow:
    1px 1px 0 #000000;

  transition: none;

  opacity: 1;
}

body.tema-windows98 button:hover {
  background: #c0c0c0;
  color: #000000;
  opacity: 1;
}

body.tema-windows98 button:focus {
  outline: 1px dotted #000000;
  outline-offset: -5px;
}

body.tema-windows98 button:active {
  background: #c0c0c0;

  border-top-color: #808080;
  border-left-color: #808080;
  border-right-color: #ffffff;
  border-bottom-color: #ffffff;

  box-shadow: none;

  transform: none;
}


/* =====================================================
   WINDOWS 98 — TOTAL
===================================================== */

body.tema-windows98 .total {
  flex: 0 0 auto;

  display: flex !important;

  width: 100%;

  min-height: 60px;
  height: 60px;

  margin-top: 4px;
  margin-bottom: 0;

  padding: 6px 4px;

  background: #c0c0c0;

  color: #000000;

  overflow: visible;

  position: relative;

  z-index: 10;
}

body.tema-windows98 .resumo-esquerda,
body.tema-windows98 .resumo-direita {
  display: flex;

  flex-direction: column;

  gap: 6px;

  color: #000000;

  flex: 1;
}

body.tema-windows98 .resumo-direita {
  text-align: right;
}

/* =====================================================
   WINDOWS 98 — MENU INFERIOR
===================================================== */

body.tema-windows98 .menu-mobile {
  background: #c0c0c0;

  border: 2px outset #ffffff;
  border-bottom: none;

  box-shadow: none;

  padding: 4px 2px;
}

body.tema-windows98 .menu-mobile button {
  background: #c0c0c0;

  color: #000000;

  border: 2px outset #ffffff;

  border-top-color: #ffffff;
  border-left-color: #ffffff;
  border-right-color: #404040;
  border-bottom-color: #404040;

  border-radius: 0;

  box-shadow: none;

  font-family:
    "MS Sans Serif",
    Tahoma,
    Arial,
    sans-serif;

  font-size: 11px;

  font-weight: normal;

  text-shadow: none;

  transition: none;
}

body.tema-windows98 .menu-mobile button:hover {
  background: #c0c0c0;

  color: #000000;

  opacity: 1;
}

body.tema-windows98 .menu-mobile button:active {
  border-top-color: #404040;
  border-left-color: #404040;
  border-right-color: #ffffff;
  border-bottom-color: #ffffff;

  border-style: solid;

  transform: none;
}



/* =====================================================
   MATRIX
===================================================== */

body.tema-matrix {
  background: #000000;

  color: #00ff41;
}

body.tema-matrix * {
  font-family: "Courier New", monospace;
}

body.tema-matrix .container {
  background: #000000;
}

body.tema-matrix .topo-app h1 {
  color: #00ff41;

  text-shadow:
    0 0 8px #00ff41;
}

body.tema-matrix input,
body.tema-matrix select {
  background: #000000;

  color: #00ff41;

  border: 1px solid #00ff41;

  border-radius: 0;
}

body.tema-matrix input::placeholder {
  color: #008f11;
}

body.tema-matrix th {
  background: #003b00;

  color: #00ff41;

  border-bottom: 1px solid #00ff41;
}

body.tema-matrix td {
  color: #00ff41;

  border-bottom: 1px solid #003b00;
}

body.tema-matrix tr:hover {
  background: #001f00;
}

body.tema-matrix .menu-mobile {
  background: #000000;

  border: 1px solid #00ff41;

  box-shadow:
    0 0 10px rgba(0, 255, 65, .25);

  box-sizing: border-box;
}


body.tema-matrix .menu-mobile button {
  color: #00ff41;

  border: none;

  background: transparent;
}

body.tema-matrix .total {
  color: #00ff41;
}

body.tema-matrix .comprado td {
  background: #002b00;

  color: #00aa22;
}

body.tema-matrix .checkmark {
  background: #000000;

  border-color: #00ff41;

  border-radius: 0;
}

body.tema-matrix .check-container input:checked + .checkmark {
  background: #003b00;

  border-color: #00ff41;
}

body.tema-matrix .modal-conteudo,
body.tema-matrix .modal-edicao-conteudo,
body.tema-matrix .modal-novo-item {
  background: #000000;

  border: 1px solid #00ff41;

  border-radius: 0;

  box-shadow:
    0 0 20px rgba(0, 255, 65, .3);
}

body.tema-matrix .modal-conteudo h3,
body.tema-matrix .modal-edicao-conteudo h3,
body.tema-matrix .modal-novo-item h3 {
  color: #00ff41;
}


/* =====================================================
   MATRIX — TABELA
===================================================== */

body.tema-matrix th,
body.tema-matrix td {
  padding: 4px 2px;

  font-size: 11px;

  white-space: nowrap;

  word-break: normal;
}

body.tema-matrix th:nth-child(1),
body.tema-matrix td:nth-child(1) {
  width: 22px;

  padding-left: 2px;
  padding-right: 2px;
}

body.tema-matrix th:nth-child(2),
body.tema-matrix td:nth-child(2) {
  width: auto;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  word-break: normal;
}

body.tema-matrix th:nth-child(3),
body.tema-matrix td:nth-child(3) {
  width: 43px;

  white-space: nowrap;

  word-break: normal;

  text-align: right;
}

body.tema-matrix th:nth-child(4),
body.tema-matrix td:nth-child(4) {
  width: 70px;

  white-space: nowrap;

  word-break: normal;

  text-align: right;
}

body.tema-matrix th:nth-child(5),
body.tema-matrix td:nth-child(5) {
  width: 70px;

  white-space: nowrap;

  word-break: normal;

  text-align: right;
}

body.tema-matrix th:nth-child(6),
body.tema-matrix td:nth-child(6) {
  width: 32px;

  padding-left: 1px;
  padding-right: 1px;

  text-align: center;

  white-space: nowrap;
}


/* =====================================================
   MODAL DE TEMAS
===================================================== */

.modal-temas {
  max-width: 340px;
}

.temas-botoes {
  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-bottom: 12px;
}

.tema-btn {
  width: 100%;

  height: 48px;

  border-radius: 8px;

  border: none;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;
}

.tema-claro {
  background: #ffffff;

  color: #111827;

  border: 2px solid #d1d5db;
}

.tema-dark {
  background: #1f2937;

  color: #ffffff;
}

.tema-win98 {
  background: #c0c0c0;

  color: #000000;

  border: 2px outset #ffffff;

  border-radius: 0;

  font-family:
    "MS Sans Serif",
    Tahoma,
    Arial,
    sans-serif;
}

.tema-matrix {
  background: #000000;

  color: #00ff41;

  border: 1px solid #00ff41;

  border-radius: 0;

  font-family: "Courier New", monospace;

  text-shadow:
    0 0 5px #00ff41;
}

.tema-btn:active {
  transform: scale(.97);
}

.tema-btn.tema-ativo {
  outline: 3px solid #2563eb;

  outline-offset: 2px;
}


/* =====================================================
   ANIMAÇÃO
===================================================== */

@keyframes fade {

  from {
    transform: scale(.95);

    opacity: 0;
  }

  to {
    transform: scale(1);

    opacity: 1;
  }

}


/* =====================================================
   ÍCONES MONOCROMÁTICOS
===================================================== */

.menu-mobile button .icone {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 22px;
  height: 22px;

  font-family:
    "Courier New",
    monospace;

  font-size: 19px;

  font-weight: bold;

  line-height: 22px;

  color: currentColor;

  transition: .2s ease;

  font-variant-emoji: text;
}

.menu-mobile button:hover .icone {
  transform: scale(1.12);
}


/* =====================================================
   A-Z — ÍCONE CSS
===================================================== */

.menu-mobile button .icone-az {
  position: relative;

  display: flex;

  align-items: center;
  justify-content: center;

  width: 24px;
  height: 22px;

  font-family: Arial, sans-serif;

  font-size: 17px;

  font-weight: bold;

  color: currentColor;
}

.icone-az > span:first-child {
  line-height: 22px;
}

  <script>

    /* =====================================================
       FUNÇÃO $
    ===================================================== */

    const $ = id =>
      document.getElementById(id);


    /* =====================================================
       LISTA
    ===================================================== */

    let lista = [];

    try {

      const data =
        localStorage.getItem("lista");

      lista =
        data
          ? JSON.parse(data)
          : [];

    } catch (e) {

      console.log(
        "Erro no storage, resetando lista"
      );

      lista = [];

    }


    let editando = null;

    let idAtual =
      Number(
        localStorage.getItem("id")
      ) || 1;

    let itemSelecionado = null;

    let ordemAlfabetica = true;


    /* =====================================================
       STORAGE
    ===================================================== */

    function salvarStorage() {

      localStorage.setItem(
        "lista",
        JSON.stringify(lista)
      );

      localStorage.setItem(
        "id",
        idAtual
      );

    }


    /* =====================================================
       VIBRAÇÃO
    ===================================================== */

    function vibrar(
      tempo = 40
    ) {

      if (navigator.vibrate) {

        navigator.vibrate(tempo);

      }

    }


    document.addEventListener(
      "click",
      e => {

        if (
          e.target.tagName === "BUTTON" ||
          e.target.type === "checkbox"
        ) {

          vibrar();

        }

      }
    );


    /* =====================================================
       TEMAS
    ===================================================== */

    function alterarTema(tema) {

      document.body.classList.remove(
        "tema-branco",
        "tema-escuro",
        "tema-windows98",
        "tema-matrix"
      );

      document.body.classList.add(
        "tema-" + tema
      );

      localStorage.setItem(
        "tema",
        tema
      );

      atualizarTemaAtivo();

      fecharModalTema();

    }


    function atualizarTemaAtivo() {

      const temaAtual =
        localStorage.getItem(
          "tema"
        ) || "branco";

      document
        .querySelectorAll(".tema-btn")
        .forEach(botao => {

          botao.classList.remove(
            "tema-ativo"
          );

        });


      const botoes = {

        branco: ".tema-claro",

        escuro: ".tema-dark",

        windows98: ".tema-win98",

        matrix: ".tema-matrix"

      };


      const botaoAtivo =
        document.querySelector(
          botoes[temaAtual]
        );


      if (botaoAtivo) {

        botaoAtivo.classList.add(
          "tema-ativo"
        );

      }

    }


    function carregarTema() {

      const temaSalvo =
        localStorage.getItem(
          "tema"
        ) || "branco";


      document.body.classList.add(
        "tema-" + temaSalvo
      );


      atualizarTemaAtivo();

    }


    /* =====================================================
       MODAL TEMA
    ===================================================== */

    function abrirModalTema() {

      atualizarTemaAtivo();

      $("modalTema").style.display =
        "flex";

      vibrar();

    }


    function fecharModalTema() {

      $("modalTema").style.display =
        "none";

    }


    /* =====================================================
       MODAL AÇÕES
    ===================================================== */

    function abrirModal(id) {

      itemSelecionado = id;

      const item =
        lista.find(
          i => i.id === id
        );


      if (!item) return;


      $("modalTitulo").textContent =
        item.produto;


      $("modalAcoes").style.display =
        "flex";

    }


    function fecharModal() {

      $("modalAcoes").style.display =
        "none";

    }


    /* =====================================================
       EDITAR
    ===================================================== */

    function editarItemModal() {

      if (!itemSelecionado)
        return;


      const item =
        lista.find(
          i => i.id === itemSelecionado
        );


      if (!item) return;


      $("editarProduto").value =
        item.produto;

      $("editarQuantidade").value =
        item.quantidade;

      $("editarValor").value =
        item.valor;

      $("editarTipo").value =
        item.tipo;


      $("modalAcoes").style.display =
        "none";


      $("modalEdicao").style.display =
        "flex";


      vibrar();

    }


    function fecharModalEdicao() {

      $("modalEdicao").style.display =
        "none";

      itemSelecionado = null;

    }


    function salvarEdicaoModal() {

      if (!itemSelecionado)
        return;


      const item =
        lista.find(
          i => i.id === itemSelecionado
        );


      if (!item)
        return;


      const produto =
        $("editarProduto")
          .value
          .trim()
          .toUpperCase();

      if (produto.length > 15) {

  alert(
    "O nome do produto pode ter no máximo 15 caracteres."
  );

  return;

}



      const quantidade =
        parseFloat(
          $("editarQuantidade")
            .value
            .replace(",", ".")
        );


      const valor =
        parseFloat(
          $("editarValor")
            .value
            .replace(",", ".")
        ) || 0;


      const tipo =
        $("editarTipo").value;


      if (
        !produto ||
        quantidade <= 0
      ) {

        alert(
          "Preencha os campos corretamente."
        );

        return;

      }


      item.produto =
        produto;

      item.quantidade =
        quantidade;

      item.valor =
        valor;

      item.tipo =
        tipo;


      salvarStorage();

      fecharModalEdicao();

      renderizarTabela();

      vibrar([
        80,
        40,
        80
      ]);

    }


    /* =====================================================
       EXCLUIR
    ===================================================== */

    function excluirItemModal() {

      if (!itemSelecionado)
        return;


      if (
        confirm(
          "Excluir item?"
        )
      ) {

        excluir(
          itemSelecionado
        );

        fecharModal();

      }

    }


    function excluir(id) {

      lista =
        lista.filter(
          i => i.id !== id
        );


      salvarStorage();

      vibrar();

      renderizarTabela();

    }


    /* =====================================================
       NOVO ITEM
    ===================================================== */

    function abrirModalNovoItem() {

      $("novoProduto").value =
        "";

      $("novaQuantidade").value =
        "";

      $("novoValor").value =
        "";

      $("novoTipo").value =
        "Unidade";


      $("modalNovoItem").style.display =
        "flex";


      vibrar();


      setTimeout(
        () => {

          $("novoProduto").focus();

        },
        100
      );

    }


    function fecharModalNovoItem() {

      $("modalNovoItem").style.display =
        "none";

    }


    function salvarNovoItem() {

      const produto =
        $("novoProduto")
          .value
          .trim()
          .toUpperCase();


      const quantidade =
        parseFloat(
          $("novaQuantidade")
            .value
            .replace(",", ".")
        );


      const valor =
        parseFloat(
          $("novoValor")
            .value
            .replace(",", ".")
        ) || 0;


      const tipo =
        $("novoTipo").value;


      if (
        !produto ||
        quantidade <= 0
      ) {

        alert(
          "Preencha os campos corretamente."
        );

        return;

      }


      const item = {

        id: idAtual++,

        produto,

        quantidade,

        valor,

        tipo,

        comprado: false

      };


      lista.push(item);

      salvarStorage();

      renderizarTabela();

      fecharModalNovoItem();

      vibrar([
        80,
        40,
        80
      ]);

    }


    /* =====================================================
       CHECKBOX
    ===================================================== */

    function toggleComprado(id) {

      const item =
        lista.find(
          i => i.id === id
        );


      if (!item)
        return;


      item.comprado =
        !item.comprado;


      salvarStorage();

      vibrar();

      renderizarTabela();

    }


    /* =====================================================
       DESMARCAR TODOS
    ===================================================== */

    function desmarcarTodos() {

      const existemMarcados =
        lista.some(
          item => item.comprado
        );


      if (!existemMarcados) {

        vibrar();

        return;

      }


      const confirmar =
        confirm(
          "Deseja realmente desmarcar todos os itens?"
        );


      if (!confirmar)
        return;


      lista.forEach(
        item => {

          item.comprado =
            false;

        }
      );


      salvarStorage();

      renderizarTabela();

      vibrar([
        80,
        40,
        80
      ]);

    }


    /* =====================================================
       ORDENAR
    ===================================================== */

    function ordenarAlfabetico() {

      lista.sort(
        (a, b) => {

          const resultado =
            a.produto.localeCompare(
              b.produto,
              "pt-BR",
              {
                sensitivity:
                  "base"
              }
            );


          return ordemAlfabetica
            ? resultado
            : -resultado;

        }
      );


      ordemAlfabetica =
        !ordemAlfabetica;


      salvarStorage();

      renderizarTabela();

      vibrar([
        80,
        40,
        80
      ]);

    }


    /* =====================================================
       RENDERIZAR TABELA
    ===================================================== */

    function renderizarTabela(
      filtro = lista
    ) {

      const tbody =
        $("tabelaItens");


      tbody.innerHTML =
        "";


      let total = 0;

      let totalComprados = 0;

      let itensComprados = 0;


      filtro.forEach(
        (item, index) => {

          const subtotal =
            item.quantidade *
            item.valor;


          total +=
            subtotal;


          if (item.comprado) {

            totalComprados +=
              subtotal;

            itensComprados++;

          }


          const tr =
            document.createElement(
              "tr"
            );


          if (item.comprado) {

            tr.classList.add(
              "comprado"
            );

          }


          tr.onclick =
            () =>
              abrirModal(
                item.id
              );


          tr.innerHTML = `

            <td style="text-align:center;">
              ${index + 1}
            </td>

            <td>
              ${item.produto}
            </td>

            <td style="text-align:right;">
              ${item.quantidade}
            </td>

            <td style="text-align:right;">
              R$ ${item.valor.toFixed(2)}
            </td>

            <td style="text-align:right;">
              R$ ${subtotal.toFixed(2)}
            </td>

            <td style="text-align:center; vertical-align:middle;">

              <label
                class="check-container"
                onclick="event.stopPropagation()">

                <input
                  type="checkbox"
                  ${item.comprado ? "checked" : ""}
                  onchange="toggleComprado(${item.id})">

                <span class="checkmark"></span>

              </label>

            </td>

          `;


          tbody.appendChild(
            tr
          );

        }
      );


      $("totalItens").textContent =
        filtro.length;


      $("totalLista").textContent =
        total.toFixed(2);


      $("totalItensComprados").textContent =
        itensComprados;


      $("totalComprados").textContent =
        totalComprados.toFixed(2);

    }


    /* =====================================================
       PESQUISA
    ===================================================== */

    function configurarPesquisa() {

      $("pesquisa")
        .addEventListener(
          "input",
          function () {

            const termo =
              this.value
                .toLowerCase()
                .trim();


            const filtrado =
              lista.filter(
                item =>
                  item.produto
                    .toLowerCase()
                    .includes(termo)
              );


            renderizarTabela(
              filtrado
            );

          }
        );

    }


    /* =====================================================
       GERAR TXT
    ===================================================== */

    function gerarTXT() {

      let texto = "";

      let total = 0;


      const COL_PRODUTO = 28;

      const COL_QTD = 8;

      const COL_VALOR = 12;

      const COL_TOTAL = 12;


      const linha =
        (
          produto,
          qtd,
          valor,
          subtotal
        ) => {

          return (

            produto.padEnd(
              COL_PRODUTO
            ) +

            qtd.padStart(
              COL_QTD
            ) +

            valor.padStart(
              COL_VALOR
            ) +

            subtotal.padStart(
              COL_TOTAL
            )

          );

        };


      texto +=
`============================================================
                     LISTA DE COMPRAS
============================================================

`;


      texto +=
        linha(
          "PRODUTO",
          "QTD",
          "VALOR",
          "TOTAL"
        );


      texto += "\n";


      texto +=
        `${"-".repeat(60)}\n`;


      lista.forEach(
        (item, index) => {

          const subtotal =
            item.quantidade *
            item.valor;


          total +=
            subtotal;


          texto +=
            linha(

              `${index + 1}. ${item.produto.substring(
                0,
                COL_PRODUTO - 3
              )}`,

              item.quantidade
                .toString(),

              `R$ ${item.valor.toFixed(2)}`,

              `R$ ${subtotal.toFixed(2)}`

            );


          texto += "\n";

        }
      );


      texto +=
        `${"-".repeat(60)}\n`;


      texto +=
        `TOTAL GERAL: R$ ${total.toFixed(2)}\n`;


      return texto;

    }


    /* =====================================================
       IMPRIMIR
    ===================================================== */

    function imprimirTXT() {

      const texto =
        gerarTXT();


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.style.position =
        "fixed";

      iframe.style.right =
        "0";

      iframe.style.bottom =
        "0";

      iframe.style.width =
        "0";

      iframe.style.height =
        "0";

      iframe.style.border =
        "0";


      document.body.appendChild(
        iframe
      );


      const doc =
        iframe.contentWindow.document;


      doc.open();


      doc.write(`

        <html>

          <head>

            <title>
              Lista de Compras
            </title>

            <style>

              @page {
                margin: 10mm;
              }

              body {
                font-family:
                  Courier New,
                  monospace;

                white-space: pre;

                padding: 20px;

                font-size: 12px;

                margin: 0;
              }

            </style>

          </head>

          <body>${texto}</body>

        </html>

      `);


      doc.close();


      iframe.onload =
        () => {

          iframe.contentWindow
            .focus();

          iframe.contentWindow
            .print();


          setTimeout(
            () => {

              document.body
                .removeChild(
                  iframe
                );

            },
            1000
          );

        };

    }


    /* =====================================================
       BACKUP
    ===================================================== */

    function exportarLista() {

      const blob =
        new Blob(
          [
            JSON.stringify(
              lista,
              null,
              2
            )
          ],
          {
            type:
              "application/json"
          }
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        URL.createObjectURL(
          blob
        );


      link.download =
        "lista_compras.json";


      link.click();


      URL.revokeObjectURL(
        link.href
      );

    }


    /* =====================================================
       IMPORTAR
    ===================================================== */

    function importarLista(
      event
    ) {

      const arquivo =
        event.target.files[0];


      if (!arquivo)
        return;


      const leitor =
        new FileReader();


      leitor.onload =
        e => {

          try {

            const dados =
              JSON.parse(
                e.target.result
              );


            if (
              !Array.isArray(
                dados
              )
            ) {

              alert(
                "Arquivo inválido"
              );

              return;

            }


            lista =
              dados;


            idAtual =
              lista.length

                ? Math.max(
                    ...lista.map(
                      i => Number(i.id) || 0
                    )
                  ) + 1

                : 1;


            salvarStorage();

            renderizarTabela();


            alert(
              "Lista importada com sucesso!"
            );


          } catch {

            alert(
              "Erro ao importar arquivo"
            );

          }

        };


      leitor.readAsText(
        arquivo
      );

    }


    /* =====================================================
       MODAIS - EVENTOS
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        carregarTema();

        renderizarTabela();

        configurarPesquisa();


        const modal =
          $("modalAcoes");


        const modalConteudo =
          document.querySelector(
            "#modalAcoes .modal-conteudo"
          );


        modal.addEventListener(
          "click",
          () => {

            fecharModal();

          }
        );


        modalConteudo.addEventListener(
          "click",
          e => {

            e.stopPropagation();

          }
        );


        const modalEdicao =
          $("modalEdicao");


        modalEdicao.addEventListener(
          "click",
          () => {

            fecharModalEdicao();

          }
        );


        const modalNovoItem =
          $("modalNovoItem");


        modalNovoItem.addEventListener(
          "click",
          () => {

            fecharModalNovoItem();

          }
        );


        const modalTema =
          $("modalTema");


        modalTema.addEventListener(
          "click",
          () => {

            fecharModalTema();

          }
        );


        $("arquivo")
          .addEventListener(
            "change",
            importarLista
          );


        if (
          window.matchMedia(
            "(display-mode: standalone)"
          ).matches
        ) {

          console.log(
            "Rodando como PWA"
          );

        }

      }
    );


    /* =====================================================
       SERVICE WORKER
    ===================================================== */

    if (
      "serviceWorker" in navigator
    ) {

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )

        .then(
          () => {

            console.log(
              "PWA instalada!"
            );

          }
        )

        .catch(
          err => {

            console.log(
              "Erro:",
              err
            );

          }
        );

    }

  </script>

</body>

</html>
