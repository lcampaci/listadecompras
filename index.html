   /* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html, body{
  height: 100%;
  overflow: hidden;
}

/* CONTAINER PRINCIPAL */
.container {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 15px;
  padding-bottom: 0; /* importante: tira o espaço fixo */
  gap: 6px; /* controla melhor o espaçamento */
}
/* TOPO */
.topo-app{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:15px;
}

.topo-app h1{
  font-size:24px;
  color:#111827;
}

/* MENU MOBILE */
.menu-mobile{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  margin:0;

  display:flex;
  justify-content:space-around;
  align-items:center;

  background:#fff;

  border-top:1px solid #e5e7eb;

  padding:8px 0;

  box-shadow:0 -2px 12px rgba(0,0,0,.08);

  z-index:9999;
}

/* BOTÕES MENU */
.menu-mobile button{
  flex:1;
  border:none;
  background:none;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:4px;

  min-height:56px;

  color:#6b7280;
}

.menu-mobile button span{
  font-size:22px;
}

.menu-mobile button small{
  font-size:10px;
}

/* PESQUISA */
#pesquisa{
  width:100%;
  margin:6px 0;
}

/* TABELA */
.tabela-wrapper{
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#2563eb;

}

th,
td{

}

/* RESUMO */
.total{

}

.resumo-esquerda,

    /* =========================
   CHECKBOX BONITO
========================= */


    .check-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      margin: auto;
      cursor: pointer;
    }

    .check-container input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .checkmark {
      position: absolute;
      inset: 0;
      background: #e5e7eb;
      border-radius: 6px;
      transition: .2s;
      border: 2px solid #cbd5e1;
    }

    .checkmark::after {
      content: "";
      position: absolute;
      display: none;

      left: 7px;
      top: 2px;

      width: 5px;
      height: 10px;

      border: solid white;
      border-width: 0 3px 3px 0;

      transform: rotate(45deg);
    }

    .check-container input:checked+.checkmark {
      background: #22c55e;
      border-color: #22c55e;
    }

    .check-container input:checked+.checkmark::after {
      display: block;
    }

    input,
    select {
      height: 36px;
      border-radius: 6px;
      border: 1px solid #ddd;
      padding: 6px 10px;
      font-size: 13px;
      box-sizing: border-box;
      text-transform: uppercase;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      transition: .2s;
    }

    button:hover {
      opacity: .9;

    let lista = [];

    try {
      const data = localStorage.getItem("lista");
      lista = data ? JSON.parse(data) : [];
    } catch (e) {
      console.log("erro storage, resetando lista");
      lista = [];
    }

    let editando = null;

    let idAtual =
      Number(localStorage.getItem("id")) || 1;

    const $ = id =>
      document.getElementById(id);



    function salvarStorage() {

      localStorage.setItem(
        "lista",
        JSON.stringify(lista)
      );

      localStorage.setItem(
        "id",
        idAtual
      );
    }

    let itemSelecionado = null;

    function abrirModal(id) {

      itemSelecionado = id;

      const item =
        lista.find(i => i.id === id);

      if (!item) return;

      $("modalTitulo").textContent =
        item.produto;

      $("modalAcoes").style.display =
        "flex";
    }

    /* =========================
   VIBRAÇÃO
========================= */

    function vibrar(tempo = 40) {

      if (navigator.vibrate) {

        navigator.vibrate(tempo);

      }
    }

    /* vibração em TODOS os botões */
    document.addEventListener("click", e => {

      if (
        e.target.tagName === "BUTTON" ||
        e.target.type === "checkbox"
      ) {

        vibrar();

      }

    });

    let ordemAlfabetica = true;

function ordenarAlfabetico() {

  lista.sort((a, b) => {

    const resultado = a.produto.localeCompare(
      b.produto,
      "pt-BR",
      {
        sensitivity: "base"
      }
    );

    return ordemAlfabetica
      ? resultado
      : -resultado;
  });

  ordemAlfabetica = !ordemAlfabetica;

  salvarStorage();
  renderizarTabela();

  vibrar([80, 40, 80]);
}


function desmarcarTodos() {

  const existemMarcados =
    lista.some(item => item.comprado);

  if (!existemMarcados) {
    vibrar();
    return;
  }

  const confirmar = confirm(
    "Deseja realmente desmarcar todos os itens?"
  );

  if (!confirmar) {
    return;
  }

  lista.forEach(item => {
    item.comprado = false;
  });

  salvarStorage();

  renderizarTabela();

  vibrar([80, 40, 80]);
}


    function fecharModal() {

  $("modalAcoes").style.display = "none";

  // NÃO limpar itemSelecionado aqui

}


function editarItemModal() {

  if (!itemSelecionado) return;

  const item = lista.find(i => i.id === itemSelecionado);

  if (!item) return;

  // Preenche os campos
  $("editarProduto").value = item.produto;
  $("editarQuantidade").value = item.quantidade;
  $("editarValor").value = item.valor;
  $("editarTipo").value = item.tipo;

  // Fecha somente o modal de ações
  $("modalAcoes").style.display = "none";

  // Abre o modal de edição
  $("modalEdicao").style.display = "flex";

  vibrar();
}


function fecharModalEdicao() {

  $("modalEdicao").style.display = "none";

  itemSelecionado = null;
}


function salvarEdicaoModal() {

  if (!itemSelecionado) return;

  const item = lista.find(
    i => i.id === itemSelecionado
  );

  if (!item) return;

  const produto =
    $("editarProduto")
      .value
      .trim()
      .toUpperCase();

  const quantidade =
    parseFloat(
      $("editarQuantidade").value.replace(",", ".")
    );

  const valor =
    parseFloat(
      $("editarValor").value.replace(",", ".")
    ) || 0;

  const tipo =
    $("editarTipo").value;

  if (!produto || quantidade <= 0) {

    alert("Preencha os campos corretamente.");

    return;
  }

  // Atualiza o item
  item.produto = produto;
  item.quantidade = quantidade;
  item.valor = valor;
  item.tipo = tipo;

  // Salva no localStorage
  salvarStorage();

  // Fecha modal
  fecharModalEdicao();

  // Atualiza tabela
  renderizarTabela();

  vibrar([80, 40, 80]);
}

    function excluirItemModal() {

      if (itemSelecionado) {

        if (confirm("Excluir item?")) {

          excluir(itemSelecionado);
          vibrar();
          fecharModal();
        }
      }
    }

    function limparCampos() {

      $("produto").value = "";
      $("quantidade").value = "";
      $("valor").value = "";
      $("tipo").value = "Unidade";

      editando = null;
    }

    function salvarItem() {

      const produto =
        $("produto")
          .value
          .trim()
          .toUpperCase();

      const quantidade =
        parseFloat(
          $("quantidade").value.replace(",", ".")
        );

      const valor =
        parseFloat(
          $("valor").value.replace(",", ".")
        ) || 0;

      const tipo =
        $("tipo").value;

      if (
        !produto ||
        quantidade <= 0
      ) {
        alert("Preencha os campos corretamente.");
        return;
      }

      const item = {

        id: editando || idAtual++,

        produto,

        quantidade,

        valor,

        tipo,

        comprado: false
      };

      if (editando) {

        const index =
          lista.findIndex(
            i => i.id === editando
          );

        item.comprado =
          lista[index].comprado;

        lista[index] = item;

      } else {

        lista.push(item);

      }

      salvarStorage();

      /* vibração forte ao salvar */
      vibrar([80, 40, 80]);

      limparCampos();

      renderizarTabela();
    }

function abrirModalNovoItem() {

function fecharModalNovoItem() {

}


/* =====================================================
   SALVAR NOVO ITEM
===================================================== */

function salvarNovoItem() {

  const produto =
    $("novoProduto")
      .value
      .trim()
      .toUpperCase();

  const quantidade =
    parseFloat(
      $("novaQuantidade")
        .value
        .replace(",", ".")
    );

        .value
        .replace(",", ".")

}

	  


    function renderizarTabela(filtro = lista) {

      const tbody = $("tabelaItens");

      tbody.innerHTML = "";

      let total = 0;

      let totalComprados = 0;

      let itensComprados = 0;

      filtro.forEach((item, index) => {

        const subtotal =
          item.quantidade * item.valor;

        total += subtotal;

        // SOMA DOS MARCADOS
        if (item.comprado) {

          totalComprados += subtotal;

          itensComprados++;

        }

        const tr =
          document.createElement("tr");

        if (item.comprado) {
          tr.classList.add("comprado");
        }

        tr.onclick = () => abrirModal(item.id);

        tr.innerHTML = `

      <td style="text-align:center;">
        ${index + 1}
      </td>

      <td>${item.produto}</td>

      <td style="text-align:right;">
        ${item.quantidade}
      </td>

      <td style="text-align:right;">
        R$ ${item.valor.toFixed(2)}
      </td>

      <td style="text-align:right;">
        R$ ${subtotal.toFixed(2)}
      </td>

      <td style="text-align:center; vertical-align:middle;">

        <label
          class="check-container"
          onclick="event.stopPropagation()"
        >

          <input
            type="checkbox"
            ${item.comprado ? "checked" : ""}
            onchange="toggleComprado(${item.id})"
          >

          <span class="checkmark"></span>

        </label>

      </td>

    `;

        tbody.appendChild(tr);

      });

      // TOTAL GERAL
      $("totalItens").textContent =
        filtro.length;

      $("totalLista").textContent =
        total.toFixed(2);

      // TOTAL DOS MARCADOS
      $("totalItensComprados").textContent =
        itensComprados;

      $("totalComprados").textContent =
        totalComprados.toFixed(2);
    }
    function editar(id) {

      const item =
        lista.find(i => i.id === id);

      if (!item) return;

      $("produto").value =
        item.produto;

      $("quantidade").value =
        item.quantidade;

      $("valor").value =
        item.valor;

      $("tipo").value =
        item.tipo;

      editando = id;
    }

    function excluir(id) {

      lista =
        lista.filter(i => i.id !== id);

      salvarStorage();
      vibrar();
      renderizarTabela();
    }

    function toggleComprado(id) {

      const item =
        lista.find(i => i.id === id);

      if (!item) return;

      item.comprado =
        !item.comprado;

      salvarStorage();
      vibrar();
      renderizarTabela();
    }

   

    function gerarTXT() {

      let texto = "";

      let total = 0;

      // largura fixa das colunas
      const COL_PRODUTO = 28;
      const COL_QTD = 8;
      const COL_VALOR = 12;
      const COL_TOTAL = 12;

      // função auxiliar
      const linha = (
        produto,
        qtd,
        valor,
        subtotal
      ) => {

        return (
          produto.padEnd(COL_PRODUTO) +
          qtd.padStart(COL_QTD) +
          valor.padStart(COL_VALOR) +
          subtotal.padStart(COL_TOTAL)
        );

      };

      texto +=
        `============================================================
                     LISTA DE COMPRAS
============================================================

`;

      // cabeçalho
      texto += linha(
        "PRODUTO",
        "QTD",
        "VALOR",
        "TOTAL"
      );

      texto += "\n";

      texto +=
        `${"-".repeat(60)}\n`;

      lista.forEach((item, index) => {

        const subtotal =
          item.quantidade * item.valor;

        total += subtotal;

        texto += linha(

          `${index + 1}. ${item.produto.substring(0, COL_PRODUTO - 3)}`,

          item.quantidade.toString(),

          `R$ ${item.valor.toFixed(2)}`,

          `R$ ${subtotal.toFixed(2)}`

        );

        texto += "\n";
      });

      texto +=
        `${"-".repeat(60)}\n`;

      texto +=
        `TOTAL GERAL: R$ ${total.toFixed(2)}\n`;

      return texto;
    }

    function exportarTXT() {

      const texto = gerarTXT();

      // BOM UTF-8
      const blob = new Blob(
        ["\uFEFF" + texto],
        { type: "text/plain;charset=utf-8" }
      );

      const link = document.createElement("a");

      link.href = URL.createObjectURL(blob);

      link.download = "lista_compras.txt";

      link.click();

      URL.revokeObjectURL(link.href);
    }

    function imprimirTXT() {

      const texto = gerarTXT();

      const iframe =
        document.createElement("iframe");

      iframe.style.position = "fixed";
      iframe.style.right = "0";
      iframe.style.bottom = "0";
      iframe.style.width = "0";
      iframe.style.height = "0";
      iframe.style.border = "0";

      document.body.appendChild(iframe);

      const doc =
        iframe.contentWindow.document;

      doc.open();

      doc.write(`
    <html>
      <head>
        <title>Lista de Compras</title>

        <style>

  @page{
    margin:10mm;
  }

  body{
    font-family:Courier New, monospace;
    white-space:pre;
    padding:20px;
    font-size:12px;
    margin:0;
  }

</style>
      </head>

      <body>${texto}</body>
    </html>
  `);

      doc.close();

      iframe.onload = () => {

        iframe.contentWindow.focus();

        iframe.contentWindow.print();

        setTimeout(() => {

          document.body.removeChild(iframe);

        }, 1000);
      };
    }

    function gerarPDF() {

      const { jsPDF } =
        window.jspdf;

      const doc =
        new jsPDF();

      let total = 0;

      const linhas =
        lista.map(item => {

          const subtotal =
            item.quantidade * item.valor;

          total += subtotal;

          return [

            item.produto,

            item.quantidade,

            item.valor.toFixed(2),

            subtotal.toFixed(2)

          ];

        });

      doc.text(
        "LISTA DE COMPRAS",
        14,
        15
      );

      doc.autoTable({

        startY: 20,

        head: [
          ["Produto", "Qtd", "Valor", "Total"]
        ],

        body: linhas,

        theme: "grid"

      });

      const y =
        doc.lastAutoTable.finalY || 20;

      doc.text(
        `TOTAL: R$ ${total.toFixed(2)}`,
        14,
        y + 10
      );

      return doc;
    }

    function exportarPDF() {

      gerarPDF()
        .save("lista_compras.pdf");
    }

    function exportarLista() {

      const blob =
        new Blob(

          [JSON.stringify(lista, null, 2)],

          {
            type: "application/json"
          }

        );

      const link =
        document.createElement("a");

      link.href =
        URL.createObjectURL(blob);

      link.download =
        "lista_compras.json";

      link.click();
    }

    $("arquivo")
      .addEventListener(
        "change",
        importarLista
      );

    function importarLista(event) {

      const arquivo =
        event.target.files[0];

      if (!arquivo) return;

      const leitor =
        new FileReader();

      leitor.onload = e => {

        try {

          const dados =
            JSON.parse(e.target.result);

          if (!Array.isArray(dados)) {

            alert("Arquivo inválido");

            return;
          }

          lista = dados;

          idAtual =
            lista.length
              ? Math.max(...lista.map(i => i.id)) + 1
              : 1;

          salvarStorage();

          renderizarTabela();

          alert("Lista importada com sucesso!");

        } catch {

          alert("Erro ao importar arquivo");

        }
      };

      leitor.readAsText(arquivo);
    }

    console.log("lista:", lista);

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker.register("./service-worker.js")
        .then(() => {
          console.log("PWA instalada!");
        })
        .catch(err => {
          console.log("Erro:", err);
        });

    }
  </script>
